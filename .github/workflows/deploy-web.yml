name: Deploy Flutter Web

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Install Firestore Rules test dependencies
        working-directory: firebase-tests
        run: npm ci

      - name: Test Firestore Security Rules
        run: >-
          npx --yes firebase-tools@15.28.1 emulators:exec
          --only firestore
          --project demo-cermatify
          "npm --prefix firebase-tests test"

      - name: Validate web configuration
        env:
          CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
          FIREBASE_RECAPTCHA_SITE_KEY: ${{ vars.FIREBASE_RECAPTCHA_SITE_KEY }}
        run: |
          test -n "$CLOUDINARY_UPLOAD_PRESET"
          test -n "$FIREBASE_RECAPTCHA_SITE_KEY"

      - name: Build web
        env:
          CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
          FIREBASE_RECAPTCHA_SITE_KEY: ${{ vars.FIREBASE_RECAPTCHA_SITE_KEY }}
        run: >-
          flutter build web --release
          --base-href /cermatify/
          --dart-define=CLOUDINARY_UPLOAD_PRESET="$CLOUDINARY_UPLOAD_PRESET"
          --dart-define=FIREBASE_RECAPTCHA_SITE_KEY="$FIREBASE_RECAPTCHA_SITE_KEY"

      - name: Disable Jekyll
        run: touch build/web/.nojekyll

      - name: Validate PWA artifacts and public bundle
        run: |
          node -e "JSON.parse(require('fs').readFileSync('build/web/manifest.json', 'utf8'))"
          test -f build/web/flutter_service_worker.js
          test -f build/web/icons/Icon-192.png
          test -f build/web/icons/Icon-512.png
          if grep -R -E "CLOUDINARY_API_SECRET|api_secret|BEGIN (RSA |EC )?PRIVATE KEY" build/web; then
            echo "Credential privat terdeteksi pada bundle web."
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
